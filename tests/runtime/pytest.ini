[pytest]
addopts = -s
# The test modules live in the per-tier subdirectories (eitt_tests/,
# runtime_tests/, harness_tests/) but the shared infrastructure they import
# -- conftest.py, transport/, eitt/, gui/ -- stays in tests/runtime/. With
# pytest's default "prepend" import mode the directory inserted into sys.path
# is the test file's OWN directory, i.e. the subdirectory, so `from conftest
# import ...` / `from transport.coap_client import ...` would not resolve.
# pythonpath (pytest >= 7) puts this directory on sys.path for every run,
# regardless of which tier is selected or which cwd pytest is invoked from.
pythonpath = .

# Markers used by the runtime tier.
markers =
    eitt_overlap: overlaps EITT template case(s); asserts more than the template does, kept deliberately
