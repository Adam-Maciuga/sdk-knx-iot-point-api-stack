# --- Formerly xfailed here: 5.3.1.4b / .4c / .4d -------------------------
# REMOVED 2026-07-26 after checking the template and the trace, per the
# check-template-then-trace rule. They were marked
# "BLOCKED:timer - SPAKE2+ handover timing not implemented in stack", which
# was wrong on both counts:
#   * 5.3.1.4b and 5.3.1.4c contain NO CoAPMessages at all — just two title
#     comments. They are empty placeholders the CreationMessage expects the
#     tester to fill in per project, so there is no handover and no timer to
#     block on.
#   * 5.3.1.4d contains only a factory reset ({"cmd":"reset","value":2}) plus
#     its 2.04 — again no SPAKE2+ handover.
# traces/5_3.xml agrees: the reference certification run recorded 0
# CoAPMessages for .4b and .4c, and only 2 TelNo'd messages for .4d, while
# .4a (the one variant with real content) ran 18 messages all "OK".
# Verified by removing them: section 5.3 stays 44 passed / 1 skipped.
# The stack genuinely does not implement handover (oc_knx.c:45 "SPAKE_PW = 8,
# // for device handover, not implemented yet") — but that is untested by
# these three, so an xfail here asserted a gap the suite never exercises.

# --- @@ / @@! operator prompts -> DUT control endpoints -------------------
# `@@!<text>` is EITT's "display comment in toolbar, SUSPEND EVALUATION and
# beep" command (EITT_KnxCommentCommandsScheme.xml) — a modal the operator
# dismisses after doing something PHYSICAL that no CoAP request can express.
# Bare `@@<text>` is the same modal WITHOUT the beep, so both route here.
#
# Matched by TEXT, first match wins, because `@@` on its own says only "a
# human does something" — not what. The template has exactly 6 uses today
# (grep the template for '@@' after any XML update; note `@@[` is the
# unrelated provisioning-command prefix and is dispatched before these):
#   5.3.1.3 x2  @@!  real device actions   -> control endpoints below
#   5.2.9.1     @@!  human observation     -> nothing to do
#   5.2.10.1b   @@!  human observation     -> nothing to do
#   5.4.1.8 x2  @@   sensor trigger + ack  -> below
#
# An `@@`/`@@!` that matches NOTHING here is a hard failure, not a silent skip:
# the test would otherwise "pass" while the physical step it depends on
# never happened. That is exactly what used to occur — @@! was ignored
# entirely, so 5.3.1.3's SPAKE2+-after-power-cycle step actually ran against
# a device in the PREVIOUS state, and the two hardest reset types the
# TestCase exists to cover were never exercised.
manual_actions:
  # 5.3.1.3 "Power cycle the device (OFF ->ON), once the device is ready,
  # press OK to continue". /test/restart defers a full re-init (75 ms) so the
  # stack tears down and comes back up — the closest automatable equivalent
  # to yanking power. It does NOT erase storage; that is the next prompt.
  - match: "power[- ]?cycle"
    endpoint: "/test/restart"
    reason: "manual power cycle (OFF->ON) -> deferred full re-init"

  # 5.3.1.3 "Perform Local Master Reset, once the device is ready, press OK
  # to continue". A Local Master Reset wipes the device back to factory
  # state, which is what /test/factory-reset does (storage + AT/GO table
  # erase on the main loop).
  - match: "local master reset"
    endpoint: "/test/factory-reset"
    reason: "manual Local Master Reset -> factory state"

  # 5.2.9.1 / 5.2.10.1b "Please check LAST UPDATE value" — a pure human
  # OBSERVATION: the operator reads the value off the GUI and judges it.
  # Deliberately no endpoint, and nothing for us to assert either. In BOTH
  # TestCases this prompt is the LAST meaningful step — the only thing after
  # it is `{"cmd":"reset","value":2}` — so there are no later telegrams that
  # re-check the value on our behalf. This is therefore a real (if small)
  # coverage gap, not something the automation silently covers: the
  # surrounding SWU flow is exercised, the human's eyeball check is not.
  #
  # It could be automated with a GET of /swu/lastupdate compared against the
  # run's start time, but that ASSERTS SOMETHING THE TEMPLATE DOES NOT, so
  # it is left out rather than invented.
  - match: "check LAST UPDATE value"
    reason: "human observation only (operator reads the value) — nothing automatable, and no later telegram re-checks it"

  # 5.4.1.8 "Trigger sensor during next 10 seconds after pressing OK" and
  # "Test Finished, Press OK" — two bare `@@` prompts (same modal as `@@!`,
  # no beep). BOTH are acknowledge-only, deliberately WITHOUT an endpoint.
  #
  # It is tempting to map the first onto POST /test/trigger, the way
  # _trigger_sensor does for 5.4.1.15. That is WRONG here, and the reference
  # certification run proves it: in traces/5_4_1.xml the window between
  # `pahmcast"…join=true"` (element 1591) and `Setup: Set LSM to 'loaded'`
  # (1593) contains exactly ONE empty comment and NO telegram at all. The
  # real operator did not make the device send anything — this TestCase
  # asserts the device does NOT transmit while LSM is 'loading', so a
  # trigger here injects traffic the certification run never had.
  # (Measured: doing so took the suite from 177 passed to 23 failed and the
  # runtime from ~9 to ~33 minutes.)
  #
  # The 10-second `@[w` countdown between them is the window itself and is
  # honoured as an ordinary wait. The trace records TimeToNext=22:27:29.8 on
  # the telegram after the second prompt — the operator left the modal open
  # overnight — which confirms nothing downstream depends on its duration.
  - match: "trigger sensor during"
    reason: "operator presses a PHYSICAL sensor; the test asserts nothing is transmitted in loading state, and traces/5_4_1.xml records no telegram in this window — injecting /test/trigger would test the opposite"

  - match: "test finished"
    reason: "end-of-window acknowledgement only — no device action; the 'nothing was sent' check is the surrounding steps"


# ---------------------------------------------------------------------------
# message_activation — the operator's per-message Activate choice, applied
# over the read-only master template (which must NEVER be edited).
#
# EITT encodes a device CAPABILITY as ALTERNATIVE response branches: the same
# request is followed by both a success and a refusal response, and the
# operator activates whichever the DUT actually does. Our checked-in template
# ships section 5.10's pagination pairs with the REFUSAL (4.00) active, i.e.
# "pagination not supported".
#
# This device DOES support pagination. Ground truth is the certification run
# itself, data/traces/5_10.xml, which records for every one of these requests
# a 2.05 carrying a real paginated link-format body, e.g.
#   GET /auth?pn=0&ps=1  ->  </auth/o>;if=":if.ll";ct=40,</auth?pn=1>;rt="p.next";ct=40
#
# Only 5.10.1.2 needs flipping. 5.10.1.1 (pn only) is already correct: pn=0
# answers 2.05 and pn=1/2/5 answer 4.00 because those pages are past the end
# of the data. The ?ps=0 and ?pn=5&ps=5 cases in 5.10.1.2 stay 4.00 for the
# same reason and are deliberately NOT listed here.
#
# Keyed by case name + the message's XML ID (a GUID). Both survive template
# regeneration; a telegram NUMBER would not. `index` disambiguates the two
# `auth` alternatives, which literally share one GUID.
# ---------------------------------------------------------------------------
message_activation:

  # fp/g?pn=0&ps=1  ->  trace says 2.05
  - case: '5.10.1.2 Pagination via a GET specifying the Page Number pn and the Page Size ps'
    id: 43E00AC7-DA65-4EAB-8002-A59DFDEE677E
    active: false
    reason: "template ships the 'pagination not supported' 4.00 active"
