# Maintainer overrides for the EITT XML interpreter (eitt/).
#
# Keyed by TestCase.qualified_name = "<collection>::<suite>::<case name>",
# exactly as printed by `pytest --collect-only` for the dynamically
# generated EITT tests, or by EittProject.iter_test_cases(). Copy the
# name exactly (including trailing spaces some XML authors left in) —
# conftest.py's dynamic collection warns loudly about any override key
# that never matches a real TestCase, so a typo here is never silent.
#
# action: trigger
#   The XML step needs a human to push a button / cause an event the
#   tool can't request over CoAP. Call a DUT test-only control endpoint
#   instead (see runtime_test_server.c and conftest.py for what's
#   actually registered). `params` is a dict CBOR-encoded as the POST
#   body.
#
# action: skip
#   Excluded from collection with a visible reason (pytest.skip) — use
#   for steps with no automated substitute yet.
#
# action: xfail
#   Runs, but a failure doesn't fail the suite (pytest.xfail) — use for
#   known-flaky or known-blocked telegrams.
#
# The special "variables:" key (NOT a TestCase name) is the variable
# layer EITT applies on top of the read-only template's Fields defaults:
# its variable-values JSON (GLOBAL -> test-suite -> per-collection), plus
# any later operator edit pushed into an already-generated copy. Put a
# value here when the template's shipped default is NOT what a real run
# uses — see the "How EITT generates a runnable test" section of
# tests/docs/eitt-xml-interpreter.md.

variables:
  # The template's Fields default is 1000, but that is a leftover from
  # the V31 refactor whose changelog reads "Fix 1s wait times are
  # replaced with 'GENERAL_TIME_TO_NEXT'". The variable-values JSON
  # (tests/runtime/data/2026-02-25_09-36_EittConformanceTestVariableValues.json,
  # GLOBAL and the v40 "8/10/5 - KNX IoT Point API Tests" suite — the
  # same V40 our traces were recorded against) sets 500, so a real EITT
  # run waits half what the bare template says. It is referenced by 1489
  # messages, so honouring it is also worth ~37s per full-template run.
  GENERAL_TIME_TO_NEXT: 500

  # The template default is the JSON's unfilled operator placeholder,
  # "C:/path/to/file.bin" — a Windows path that cannot exist inside the
  # Linux test container. Point it at the dummy firmware image checked in
  # beside the tests instead. Relative to the repo root, which is the
  # working directory pytest runs from (/w in run-in-docker.ps1).
  PREP_UPDATE_FILE_PATH: tests/runtime/data/FWUUploadDummySmall.bin

  # 5.2.9.1 GETs /swu/protocol and matches '/value: #5_2_9_1_DEFAULT_PROTOCOL'.
  # Neither shipped value is usable: the template says 1 and the
  # variable-values JSON says the placeholder text "defaultprotocol",
  # while the resource is an INTEGER (oc_knx_swu.c:118
  # oc_rep_i_set_int(root, 1, swu_device.protocol)). 0 is right, and is
  # what BOTH the device and the reference certification run produce:
  # oc_knx_swu.h:46 defines `CoAP = 0` as "default in specification", and
  # traces/5_2.xml TelNo 552 recorded RawContent "BF 01 00 FF" (CBOR
  # {1: 0}) with EvalResult "OK (json pointer check)".
  5_2_9_1_DEFAULT_PROTOCOL: 0

  # Same story one telegram later (the certification body's note calls
  # these out as "256" and "258"): the template default is 2 ("push and
  # pull"), but 1 = "Push Only" is equally correct per the KNX IoT
  # Specification and is what this device implements
  # (oc_knx_swu.h:91 "0=pull, 1=push=default or 2=both"). The reference
  # run agrees — traces/5_2.xml TelNo 554 recorded "BF 01 01 FF"
  # (CBOR {1: 1}) with EvalResult "OK (json pointer check)".
  5_2_9_1_UPDATE_METHOD: 1

  # 5.2.6.1 GETs /dev/hname and matches '#5_2_6_1_HOSTNAME'. The template
  # default is the bare label `knx-00fa10020800`, but the device now
  # answers the fully-qualified `knx-{serial}.local` — commit 94803394
  # (include/oc_endpoint.h, HNAME_TYPE) made that change citing KNX spec
  # 2.6.1.2.3, which specifies the host name as an mDNS/DNS-SD name.
  # The FQDN form is certifiable, not a deviation: the variable-values
  # JSON (tests/runtime/data/2026-02-25_09-36_EittConformanceTestVariable
  # Values.json) carries `knx-02c912345678.local` for this very variable
  # — another certified device answered the same way and the operator
  # filled the `.local` suffix in. Only the serial differs, so keep this
  # device's own serial and add the suffix.
  5_2_6_1_HOSTNAME: knx-00fa10020800.local

"5.3. Security::5.3.14 PUT /{base-path}/auth/o/replwdo (Optional)::5.3.14.1. Set the replay window size":
  action: skip
  reason: "Optional feature (suite title '(Optional)', template Hitem V34 'marked as optional') not implemented by the stack (no PUT handler, oc_knx_sec.c:258, g_oscore_replay_window_size hardcoded 32); the reference certification run never executed it either (traces/5_3.xml contains GETs to auth/o/replwdo but no PUT)"

# --- Accepted response-code substitutions ------------------------------------
# Where a test PLANS one error code but the device answers another, and the
# certification body accepts it. Per the Tests Spec / KSG "IoT" class meeting
# of 2025.12.12: where a test asks for "Unauthorized", a device answering
# "Forbidden" is also correct.
#
# This is not a shortcut to make tests pass — it is recorded in the reference
# certification runs themselves, which were ACCEPTED with these very
# evaluations present:
#   data/traces/5_3.xml    x5  "Message code differs, planned: 4.01, received: 4.03"
#   data/traces/5_4_1.xml  x1  "Message code differs, planned: 4.00, received: 4.03"
#
# Global rather than per-TestCase on purpose: it is a property of how this
# device reports authorization errors, not of any single test. (EITT's own
# telegram NUMBERS, which the certification notes use to point at the affected
# steps, do not survive template regeneration — see the project notes.)
#
# Without this the code assertion added for finding F1 fails 5.2.2.1 step 2 at
# the point where it checks that a post-factory-reset request is rejected; that
# failure then prevents the following @#"Copy of AUTH PREPARATION" from running
# and cascades into 17 further failures.
accepted_response_codes:
  "4.01": ["4.03"]   # Unauthorized planned, Forbidden accepted
  "4.00": ["4.03"]   # Bad Request planned, Forbidden accepted (traces/5_4_1.xml)

# --- 5.4.2: out of scope, whole suite ----------------------------------------
# "5.4.2. GET & OBSERVE /.knx" is labelled "(Preliminary - Not for Certification)"
# in the template's own suite name, and the /.knx Observe feature it exercises is
# not properly implemented in the stack yet. 6 of its 7 TestCases fail with
# "response body could not be decoded"; they are NOT a regression — they only
# became visible when the suite was first run unfiltered.
#
# 'skip' rather than 'xfail' on purpose: xfail would run them anyway (~2 min of
# Observe timeouts) and 5.4.2.2d actually PASSES, so it would report XPASS and
# reintroduce exactly the clutter this is meant to remove. Skip states the real
# situation — the section is out of scope — and covers all 7 uniformly.
#
# REMOVE these once /.knx Observe is implemented; the section then wants a real run.

