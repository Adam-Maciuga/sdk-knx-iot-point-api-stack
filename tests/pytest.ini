[pytest]
addopts = -s

# Two device tiers live side by side under tests/ and share one body of
# infrastructure:
#
#   tests/common/   fixtures.py, transport/, tools/, runtime_test_server.c
#   tests/eitt/     test_eitt.py + interpreter/, gui/, data/, harness_tests/
#   tests/runtime/  the hand-written, behaviour-named test modules
#
# With pytest's default "prepend" import mode the directory inserted into
# sys.path is the test file's OWN directory, so `from fixtures import ...`,
# `from transport.coap_client import ...`, `from interpreter.runner import
# ...` and `from gui... import ...` would not resolve. pythonpath (pytest
# >= 7) puts these three directories on sys.path for every run, regardless
# of which tier is selected or which cwd pytest is invoked from:
#
#   .        tests/          -> conftest.py
#   common   tests/common/   -> fixtures, transport.*
#   eitt     tests/eitt/     -> interpreter.*, gui.*
pythonpath = . common eitt

# Keep a bare `pytest tests/` on the two Python tiers: tests/unit is Google
# Test (C++) and tests/fuzz is libFuzzer (C), neither of which pytest runs.
testpaths = eitt runtime

# Markers used by the runtime tier.
markers =
    eitt_overlap: overlaps EITT template case(s); asserts more than the template does, kept deliberately
