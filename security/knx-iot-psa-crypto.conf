# KNX-IoT Mbed TLS and PSA crypto configuration for Zephyr builds.
#
# PSA_WANT_* settings in this file are superseded by Kconfig select
# statements in the stack module (zephyr/Kconfig under KNXIOT_LIB) which
# bypass MBEDTLS_PROMPTLESS and work for all network backends.
# This file is kept as a reference and for building without the stack module.

# ── KNX-IoT - Use Zephyr platform Mbed TLS ────────────────────────────────────
# Use Zephyr-provided module (Mbed TLS 4.x in Zephyr 4.4.0).
# In Mbed TLS 4.x crypto primitives are selected via PSA_WANT_* Kconfig symbols
# (Kconfig.psa.auto) instead of the old MBEDTLS_* module toggles.
#
# The symbols below mirror the KNX-IoT crypto requirements defined in
# security/knx_psa_crypto_config.h (used by CONFIG_KNXIOT_MBEDTLS_BUILTIN=y builds).
CONFIG_KNXIOT_MBEDTLS_BUILTIN=n
# Enable the Mbed TLS modules required by the KNX-IoT SPAKE2+ security implementation.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# Enable the PSA Crypto API
# Selects PSA_CRYPTO_CLIENT and enables PSA_WANT_* deps.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

CONFIG_MBEDTLS_ENTROPY_C=y

# MBEDTLS_PSA_CRYPTO_C requires either CTR-DRBG or HMAC-DRBG for its internal RNG.
# CTR-DRBG (AES-based) is the standard choice, it is seeded from the platform entropy.
CONFIG_MBEDTLS_CTR_DRBG_C=y

# PSA Crypto Algorithms (mirrors PSA_WANT_ALG_* in knx_psa_crypto_config.h)
# AES-CCM
# OSCORE packet encryption and decryption.
CONFIG_PSA_WANT_ALG_CCM=y
# AES-CBC
# TLS cipher suites (e.g. TLS_PSK_WITH_AES_128_CBC_SHA, TLS_ECDHE_PSK_WITH_AES_128_CBC_SHA).
# Not used by OSCORE or SPAKE2+. # TODO only with TLS
CONFIG_PSA_WANT_ALG_CBC_PKCS7=y
# SHA-256
# SPAKE2+ transcript hash (K_main), base for HMAC and HKDF.
CONFIG_PSA_WANT_ALG_SHA_256=y
# HMAC-SHA256
# SPAKE2+ key confirmations (confirmV, confirmP).
# OSCORE HKDF extract/expand steps (custom RFC 5869 implementation).
CONFIG_PSA_WANT_ALG_HMAC=y
# HKDF-SHA256
# SPAKE2+ key derivation (ConfirmationKeys, K_shared).
CONFIG_PSA_WANT_ALG_HKDF=y
# PBKDF2-HMAC-SHA256
# SPAKE2+ password expansion (w0s || w1s from password + salt).
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
# ECDH on P-256
# SPAKE2+ ephemeral key generation and shared-secret computation
# (Z = y*(shareP - w0*M), V = y*L, etc.).
CONFIG_PSA_WANT_ALG_ECDH=y

# Elliptic Curves (mirrors PSA_WANT_ECC_SECP_R1_256 in knx_psa_crypto_config.h)
# P-256 (secp256r1): sole ECC curve used by SPAKE2+
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# Key Types (mirrors PSA_WANT_KEY_TYPE_* in knx_psa_crypto_config.h)
# AES key: OSCORE AES-128-CCM
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# ECC key pair generate
# Ephemeral P-256 keypairs (x, pub_x) and (y, pub_y) in SPAKE2+.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
# ECC key pair import
# Import the w1 scalar to compute L = w1*G, import L for responder verification.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
# ECC key pair export
# Export public key (shareP, shareV) for transmission.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
# ECC public key
# Remote public key operations in SPAKE2+ (shareP, shareV point validation).
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
# HMAC key
# SPAKE2+ key confirmations (KcA, KcB derived from K_main).
# OSCORE HKDF HMAC extract and expand steps.
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
# Derivation key
# HKDF and PBKDF2 key derivation operations.
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
# Raw data key
# Symmetric key material (e.g., K_shared used as the OSCORE master secret).
CONFIG_PSA_WANT_KEY_TYPE_RAW_DATA=y
