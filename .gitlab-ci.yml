stages:
  - build
  - test

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: none

before_script:
  - git config --global protocol.file.allow always
#  - git submodule sync --recursive
#  - git submodule update --init --recursive
# ----------------------------------------------------------
# Linux Native Build
# ----------------------------------------------------------
linux-build:
  stage: build
  image: luftd/knx-ci:latest
  script:
    - cmake --preset=linux-debug-gcc
    - cmake --build --preset=linux-debug-gcc
  artifacts:
    paths:
      - out/build/linux-debug-gcc/apps
    expire_in: 1 week

