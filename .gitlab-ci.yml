stages:
  - build
  - test

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: none

before_script:
  - git config --global protocol.file.allow always
#  - git submodule sync --recursive
#  - git submodule update --init --recursive
# ----------------------------------------------------------
# Linux Native Build
# ----------------------------------------------------------
linux-build:
  stage: build
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-debug-gcc
    - cmake --build --preset=linux-debug-gcc
  artifacts:
    paths:
      - out/build/linux-debug-gcc/apps
    expire_in: 1 week

# ----------------------------------------------------------
# Unit Tests (Linux)
# ----------------------------------------------------------
linux-test:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-test-gcc
    - cmake --build --preset=linux-test-gcc
    - ctest --preset=linux-test-gcc --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-gcc/report.xml
  dependencies: []

# ----------------------------------------------------------
# Sanitizer Tests (ASan + UBSan) — Unit Tests
# ----------------------------------------------------------
linux-test-asan:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-test-asan
    - cmake --build --preset=linux-test-asan
    - ctest --preset=linux-test-asan --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-asan/report.xml
  dependencies: []

# ----------------------------------------------------------
# Sanitizer Tests (ASan + UBSan) — Runtime Conformance
# NOTE: allow_failure while a benign 1-byte SPAKE shutdown leak remains
#       (oc_oscore_set_auth_shared, api/oc_knx_sec.c). Memory-error and
#       UB detection are gating-quality; the leak is the only known noise.
# ----------------------------------------------------------
linux-runtime-test-asan:
  stage: test
  tags:
    - runtimetests
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null 2>&1
    - ip link add veth-dut type veth peer name veth-test
    - ip link set veth-dut up
    - ip link set veth-test up
    - sleep 2
    # Add multicast routes on both veth interfaces.
    # mdns_listen_sock6 sends responses via sendto() with sin6_scope_id=0;
    # without an explicit route the kernel cannot pick the outgoing interface
    # on a veth pair (no default IPv6 multicast route in Docker/GitLab CI).
    - ip -6 route add ff00::/8 dev veth-dut || true
    - ip -6 route add ff00::/8 dev veth-test || true
    - export DUT_ADDR=$(ip -6 -o addr show dev veth-dut scope link | awk '{print $4}' | cut -d/ -f1)
    - echo "DUT address=${DUT_ADDR} on veth-dut / veth-test"
    - cmake --preset=linux-test-asan -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-asan --target runtime_test_server
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet -r tests/runtime/requirements.txt
    - >
      RUNTIME_TEST_SERVER=build/linux-test-asan/tests/runtime_test_server
      DUT_IFACE=veth-dut
      DEVICE_HOST=$DUT_ADDR
      DEVICE_IFACE=veth-test
      RUNTIME_TEST_QUIET=1
      ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
      COAP_TIMEOUT=15
      SERVER_STARTUP_TIMEOUT=30
      python3 -m pytest
      tests/runtime/test_5_1_discovery.py
      tests/runtime/test_5_1_discovery_multicast.py
      tests/runtime/test_5_1_discovery_extended.py
      tests/runtime/test_5_2_wellknown_knx.py
      tests/runtime/test_5_2_fingerprint.py
      tests/runtime/test_5_2_device_resources.py
      tests/runtime/test_5_2_swu.py
      tests/runtime/test_5_3_security.py
      tests/runtime/test_5_4_group_comm.py
      tests/runtime/test_5_4_observe.py
      tests/runtime/test_5_5_fp_tables.py
      tests/runtime/test_5_6_app_program.py
      tests/runtime/test_5_7_functional_blocks.py
      tests/runtime/test_5_8_parameters.py
      tests/runtime/test_5_10_generic.py
      tests/runtime/test_5_1_discovery_mdns.py
      tests/runtime/test_5_2_reset.py
      -v --tb=short --junit-xml=build/linux-test-asan/runtime-report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-asan/runtime-report.xml
  dependencies: []
  allow_failure: true

# ----------------------------------------------------------
# Runtime Conformance Tests (network-level, like EITT)
# ----------------------------------------------------------
linux-runtime-test:
  stage: test
  tags:
    - runtimetests
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    # Install iproute2 for veth pair creation
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null 2>&1
    # Create a veth pair for multicast-capable IPv6 networking
    - ip link add veth-dut type veth peer name veth-test
    - ip link set veth-dut up
    - ip link set veth-test up
    - sleep 2  # wait for IPv6 DAD / link-local assignment
    # Add multicast routes on both veth interfaces.
    # mdns_listen_sock6 sends responses via sendto() with sin6_scope_id=0;
    # without an explicit route the kernel cannot pick the outgoing interface
    # on a veth pair (no default IPv6 multicast route in Docker/GitLab CI).
    - ip -6 route add ff00::/8 dev veth-dut || true
    - ip -6 route add ff00::/8 dev veth-test || true
    # Discover the DUT's link-local address on veth-dut
    - export DUT_ADDR=$(ip -6 -o addr show dev veth-dut scope link | awk '{print $4}' | cut -d/ -f1)
    - echo "DUT address=${DUT_ADDR} on veth-dut / veth-test"
    # Build
    - cmake --preset=linux-test-gcc -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-gcc --target runtime_test_server
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet -r tests/runtime/requirements.txt
    # Run tests — DUT binds to veth-dut, test client sends via veth-test
    # NOTE: Running only verified EITT-matching test categories.
    #       Add more test files here as each 5.x category is verified.
    - >
      RUNTIME_TEST_SERVER=build/linux-test-gcc/tests/runtime_test_server
      DUT_IFACE=veth-dut
      DEVICE_HOST=$DUT_ADDR
      DEVICE_IFACE=veth-test
      RUNTIME_TEST_QUIET=1
      python3 -m pytest
      tests/runtime/test_5_1_discovery.py
      tests/runtime/test_5_1_discovery_multicast.py
      tests/runtime/test_5_1_discovery_extended.py
      tests/runtime/test_5_2_wellknown_knx.py
      tests/runtime/test_5_2_fingerprint.py
      tests/runtime/test_5_2_device_resources.py
      tests/runtime/test_5_2_swu.py
      tests/runtime/test_5_3_security.py
      tests/runtime/test_5_4_group_comm.py
      tests/runtime/test_5_4_observe.py
      tests/runtime/test_5_5_fp_tables.py
      tests/runtime/test_5_6_app_program.py
      tests/runtime/test_5_7_functional_blocks.py
      tests/runtime/test_5_8_parameters.py
      tests/runtime/test_5_10_generic.py
      tests/runtime/test_5_1_discovery_mdns.py
      tests/runtime/test_5_2_reset.py
      -v --tb=short --junit-xml=build/linux-test-gcc/runtime-report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-gcc/runtime-report.xml
  dependencies: []
  allow_failure: true
