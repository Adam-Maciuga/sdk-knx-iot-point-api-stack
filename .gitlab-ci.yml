# ----------------------------------------------------------
# Unit Tests (Linux)
# ----------------------------------------------------------
linux-test:
  stage: test
  image: luftd/knx-ci:latest
  script:
    - cmake --preset=linux-test-gcc
    - cmake --build --preset=linux-test-gcc
    - ctest --preset=linux-test-gcc --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-gcc/report.xml
  dependencies: []

# ----------------------------------------------------------
# Sanitizer Tests (ASan + UBSan) — Unit Tests
# ----------------------------------------------------------
linux-test-asan:
  stage: test
  image: luftd/knx-ci:latest
  script:
    - cmake --preset=linux-test-asan
    - cmake --build --preset=linux-test-asan
    - ctest --preset=linux-test-asan --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-asan/report.xml
  dependencies: []

