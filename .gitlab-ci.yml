stages:
  - build
  - test

variables:
  GIT_STRATEGY: clone
  # Shallow clone: no job here uses git history (no describe/blame/log), so a
  # full clone (GIT_DEPTH: 0) only pays for history no job reads. Revisit if a
  # future step needs to diff/describe against an older commit.
  GIT_DEPTH: 1
  GIT_SUBMODULE_STRATEGY: none

before_script:
  - git config --global protocol.file.allow always
#  - git submodule sync --recursive
#  - git submodule update --init --recursive
# ----------------------------------------------------------
# Linux Native Build
# ----------------------------------------------------------
linux-build:
  stage: build
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-debug-gcc
    - cmake --build --preset=linux-debug-gcc
  artifacts:
    paths:
      - out/build/linux-debug-gcc/apps
    expire_in: 1 week

# ----------------------------------------------------------
# Unit Tests (Linux)
# ----------------------------------------------------------
linux-unit-test:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-test-gcc
    - cmake --build --preset=linux-test-gcc
    - ctest --preset=linux-test-gcc --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-gcc/report.xml
  dependencies: []

# ----------------------------------------------------------
# Sanitizer Tests (ASan + UBSan) — Unit Tests
# ----------------------------------------------------------
linux-unit-test-asan:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - cmake --preset=linux-test-asan
    - cmake --build --preset=linux-test-asan
    - ctest --preset=linux-test-asan --output-junit report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-asan/report.xml
  dependencies: []

# ----------------------------------------------------------
# Fuzzing — seed-corpus regression + coverage (gating)
# Replays every generated seed exactly once (-runs=0) first: deterministic on
# purpose, so a random mutation seed can never fail a pipeline for an
# unrelated commit. Then, per target, mutates from that corpus for a short,
# fixed budget (FUZZ_COVERAGE_SECONDS) purely to grow line coverage - any
# crash found here is logged and kept as an artifact but does NOT fail the
# job (that is what the manual linux-fuzz-explore job gates on).
# Also reports source coverage (gcov via gcovr, clang): how much of api/,
# messaging/, security/ and util/ the corpus plus the mutation burst
# reaches. Excludes tests/, third-party FetchContent deps and the vendored
# api/c-timestamp parser, matching linux-unit-test-coverage's scope.
# ----------------------------------------------------------
linux-fuzz-coverage:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  variables:
    FUZZ_COVERAGE_SECONDS: "30"
  script:
    # llvm-19 provides llvm-cov-19 (gcovr's gcov-executable for clang's
    # --coverage output); the clang package alone does not install it.
    - apt-get update -qq && apt-get install -y -qq clang libclang-rt-19-dev llvm-19 > /dev/null 2>&1
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet gcovr
    - cmake --preset=linux-fuzz-coverage-clang
    - cmake --build --preset=linux-fuzz-coverage-clang
    - ctest --preset=linux-fuzz-coverage-clang --output-junit build/linux-fuzz-coverage-clang/fuzz-report.xml
    - |
      mkdir -p fuzz-coverage-crashes
      cd build/linux-fuzz-coverage-clang/tests/fuzz
      for t in fuzz_coap_parse fuzz_oscore_options fuzz_oc_rep fuzz_mdns \
               fuzz_query_string fuzz_blockwise_reassembly fuzz_hex_and_base64 fuzz_timestamp \
               fuzz_endpoint_string_parse fuzz_swu_query_params fuzz_group_object_table \
               fuzz_oscore_context_lookup fuzz_discovery_filter fuzz_spake2plus_wire \
               fuzz_uuid_parse fuzz_oscore_full_decrypt fuzz_replay_window fuzz_oscore_aad_nonce \
               fuzz_core_res_wildcard fuzz_knx_dev_put fuzz_at_x_get_query fuzz_spake2plus_initiator \
               fuzz_knx_lsm_post fuzz_auth_at_post; do
        "./$t" "corpus/${t#fuzz_}" -max_total_time="$FUZZ_COVERAGE_SECONDS" -timeout=10 \
          -rss_limit_mb=2048 -artifact_prefix="../../../../fuzz-coverage-crashes/${t}-" \
          || echo "warning: $t found a crash during the coverage mutation burst - see fuzz-coverage-crashes/"
      done
      cd -
    - mkdir -p build/linux-fuzz-coverage-clang/coverage-html
    - >
      gcovr --root . --gcov-executable 'llvm-cov-19 gcov'
      --filter 'api/' --filter 'messaging/' --filter 'security/' --filter 'util/'
      --exclude 'api/c-timestamp/.*'
      --cobertura build/linux-fuzz-coverage-clang/coverage.xml
      --html-details build/linux-fuzz-coverage-clang/coverage-html/index.html
      --print-summary
      build/linux-fuzz-coverage-clang
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - build/linux-fuzz-coverage-clang/coverage-html/
      - fuzz-coverage-crashes/
    reports:
      junit: build/linux-fuzz-coverage-clang/fuzz-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/linux-fuzz-coverage-clang/coverage.xml
    expire_in: 4 weeks
  needs: []

# ----------------------------------------------------------
# Fuzzing — mutation run (on demand)
# Start from the GitLab UI. Override FUZZ_SECONDS when triggering to change the
# budget per target. New inputs land in fuzz-findings/, crashes in
# fuzz-crashes/; add an interesting input to tests/fuzz/make_corpus.py to keep
# it as a permanent seed.
# ----------------------------------------------------------
linux-fuzz-explore:
  stage: test
  image: itgesellschaft/knxiot-knx-ci:latest
  when: manual
  allow_failure: true
  variables:
    FUZZ_SECONDS: "900"
  script:
    # libclang-rt-19-dev provides the compiler-rt static archives (asan/ubsan/fuzzer);
    # the clang package alone only installs the frontend, not these link-time archives.
    - apt-get update -qq && apt-get install -y -qq clang libclang-rt-19-dev > /dev/null 2>&1
    - cmake --preset=linux-fuzz-clang
    - cmake --build --preset=linux-fuzz-clang
    - |
      status=0
      mkdir -p fuzz-crashes
      for t in fuzz_coap_parse fuzz_oscore_options fuzz_oc_rep fuzz_mdns \
               fuzz_query_string fuzz_blockwise_reassembly fuzz_hex_and_base64 fuzz_timestamp \
               fuzz_endpoint_string_parse fuzz_swu_query_params fuzz_group_object_table \
               fuzz_oscore_context_lookup fuzz_discovery_filter fuzz_spake2plus_wire \
               fuzz_uuid_parse fuzz_oscore_full_decrypt fuzz_replay_window fuzz_oscore_aad_nonce \
               fuzz_core_res_wildcard fuzz_knx_dev_put fuzz_at_x_get_query fuzz_spake2plus_initiator \
               fuzz_knx_lsm_post fuzz_auth_at_post; do
        seeds="build/linux-fuzz-clang/tests/fuzz/corpus/${t#fuzz_}"
        mkdir -p "fuzz-findings/$t"
        "build/linux-fuzz-clang/tests/fuzz/$t" "fuzz-findings/$t" "$seeds" \
          -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 \
          -artifact_prefix=fuzz-crashes/ || status=1
      done
      exit $status
  artifacts:
    when: always
    paths:
      - fuzz-crashes/
      - fuzz-findings/
    expire_in: 4 weeks
  needs: []

# ----------------------------------------------------------
# Sanitizer Tests (ASan + UBSan) — Runtime Conformance
# NOTE: allow_failure while a benign 1-byte SPAKE shutdown leak remains
#       (oc_oscore_set_auth_shared, api/oc_knx_sec.c). Memory-error and
#       UB detection are gating-quality; the leak is the only known noise.
# ----------------------------------------------------------
linux-runtime-test-asan:
  stage: test
  tags:
    - runtimetests
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null 2>&1
    - ip link add veth-dut type veth peer name veth-test
    - ip link set veth-dut up
    - ip link set veth-test up
    - sleep 2
    # Add multicast routes on both veth interfaces.
    # mdns_listen_sock6 sends responses via sendto() with sin6_scope_id=0;
    # without an explicit route the kernel cannot pick the outgoing interface
    # on a veth pair (no default IPv6 multicast route in Docker/GitLab CI).
    - ip -6 route add ff00::/8 dev veth-dut || true
    - ip -6 route add ff00::/8 dev veth-test || true
    - export DUT_ADDR=$(ip -6 -o addr show dev veth-dut scope link | awk '{print $4}' | cut -d/ -f1)
    - echo "DUT address=${DUT_ADDR} on veth-dut / veth-test"
    - cmake --preset=linux-test-asan -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-asan --target runtime_test_server
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet -r tests/runtime/requirements.txt
    - >
      RUNTIME_TEST_SERVER=build/linux-test-asan/tests/runtime_test_server
      DUT_IFACE=veth-dut
      DEVICE_HOST=$DUT_ADDR
      DEVICE_IFACE=veth-test
      RUNTIME_TEST_QUIET=1
      ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
      COAP_TIMEOUT=5
      SERVER_STARTUP_TIMEOUT=30
      RUNTIME_TEST_TIME_SCALE=0.05
      python3 -m pytest
      tests/runtime/eitt_tests/
      -k "Discovery:: or well-known/knx:: or Security::"
      -v --tb=short --junit-xml=build/linux-test-asan/runtime-report-eitt.xml
    # Second invocation: the hand-written runtime tier. Kept separate from the
    # EITT tier above so that tier keeps its -k section filter, and so each
    # tier produces its own JUnit report.
    - >
      RUNTIME_TEST_SERVER=build/linux-test-asan/tests/runtime_test_server
      DUT_IFACE=veth-dut
      DEVICE_HOST=$DUT_ADDR
      DEVICE_IFACE=veth-test
      RUNTIME_TEST_QUIET=1
      ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
      COAP_TIMEOUT=5
      SERVER_STARTUP_TIMEOUT=30
      RUNTIME_TEST_TIME_SCALE=0.05
      python3 -m pytest
      tests/runtime/runtime_tests/
      -v --tb=short --junit-xml=build/linux-test-asan/runtime-report-runtime.xml
  artifacts:
    when: always
    reports:
      junit:
        - build/linux-test-asan/runtime-report-eitt.xml
        - build/linux-test-asan/runtime-report-runtime.xml
  dependencies: []
  allow_failure: true

# ----------------------------------------------------------
# Runtime Conformance Tests (network-level, like EITT)
# ----------------------------------------------------------
linux-runtime-test:
  stage: test
  tags:
    - runtimetests
  image: itgesellschaft/knxiot-knx-ci:latest
  script:
    # Install iproute2 for veth pair creation
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null 2>&1
    # Create a veth pair for multicast-capable IPv6 networking
    - ip link add veth-dut type veth peer name veth-test
    - ip link set veth-dut up
    - ip link set veth-test up
    - sleep 2  # wait for IPv6 DAD / link-local assignment
    # Add multicast routes on both veth interfaces.
    # mdns_listen_sock6 sends responses via sendto() with sin6_scope_id=0;
    # without an explicit route the kernel cannot pick the outgoing interface
    # on a veth pair (no default IPv6 multicast route in Docker/GitLab CI).
    - ip -6 route add ff00::/8 dev veth-dut || true
    - ip -6 route add ff00::/8 dev veth-test || true
    # Discover the DUT's link-local address on veth-dut
    - export DUT_ADDR=$(ip -6 -o addr show dev veth-dut scope link | awk '{print $4}' | cut -d/ -f1)
    - echo "DUT address=${DUT_ADDR} on veth-dut / veth-test"
    # Build
    - cmake --preset=linux-test-gcc -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-gcc --target runtime_test_server
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet -r tests/runtime/requirements.txt
    # Run tests — DUT binds to veth-dut, test client sends via veth-test
    # The whole runtime tier runs; conftest.py orders the modules.
    - >
      RUNTIME_TEST_SERVER=build/linux-test-gcc/tests/runtime_test_server
      DUT_IFACE=veth-dut
      DEVICE_HOST=$DUT_ADDR
      DEVICE_IFACE=veth-test
      RUNTIME_TEST_QUIET=1
      python3 -m pytest
      tests/runtime/runtime_tests/
      -v --tb=short --junit-xml=build/linux-test-gcc/runtime-report.xml
  artifacts:
    when: always
    reports:
      junit: build/linux-test-gcc/runtime-report.xml
  dependencies: []
  allow_failure: true
